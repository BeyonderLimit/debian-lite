# hardware/touchscreen/sources.conf
# Pinned upstream revisions for the opt-in touchscreen stack.
# Change a revision deliberately, rebuild, and record it in CHANGELOG.md.
# Sources are cloned to $SP5_SRC_DIR (default ~/src/surfacepro5) and kept there
# for inspection, patching and rebuilding.

# Kernel driver: Intel Precise Touch & Stylus (IPTS). Surface Pro 5 = PCI 8086:9d3e.
IPTS_REPO="https://github.com/linux-surface/intel-precise-touch.git"
IPTS_REV="3b88a45360b4fdab85e2d4389fb4812f5867c1b7"   # master, 2024-04-16

# Userspace daemon: turns IPTS heatmaps into multi-touch + pen input.
IPTSD_REPO="https://github.com/linux-surface/iptsd.git"
IPTSD_REV="v3.1.1"                                     # release 2026-10-18

# Optional gesture engine (not packaged in Debian 12).
TOUCHEGG_REPO="https://github.com/JoseExposito/touchegg.git"
TOUCHEGG_REV="2.0.18"                                  # release 2025-05-24
